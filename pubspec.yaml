name: sketch_rush
description: "A real-time multiplayer drawing and guessing game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.12.0

  # State Management
  get: ^4.7.3

  # Drawing
  perfect_freehand: ^2.5.2+1
  flutter_colorpicker: ^1.1.0

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.3.4

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
